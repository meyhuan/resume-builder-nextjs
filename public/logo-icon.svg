<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Squircle Gradient (Rose-Pink to Fuchsia-Violet) -->
    <linearGradient id="roseSquircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d94" />
      <stop offset="50%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <!-- Inner Portrait Gradient -->
    <linearGradient id="portraitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Warm Champagne Gold AI Sparkle -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Soft Drop Shadow for White Resume Card -->
    <filter id="cardShadow" x="-15%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#701a75" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#roseSquircle)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="white" stroke-opacity="0.26" stroke-width="1.5" />

  <!-- Balanced Frosted Tilted Secondary Resume Card (7deg around center 33, 31) -->
  <rect x="18.5" y="12.5" width="29" height="37" rx="5.5" transform="rotate(7 33 31)" fill="white" fill-opacity="0.46" />

  <!-- Optically Centered Main White Resume Card (center: 31.5, 32.0) -->
  <rect x="16.5" y="13" width="30" height="38" rx="5.5" fill="white" filter="url(#cardShadow)" />

  <!-- Centered Geometric Portrait (cx: 31.5) -->
  <circle cx="31.5" cy="23" r="4.1" fill="url(#portraitGrad)" />
  <path d="M24 33.4C24 30.1 27.1 28.2 31.5 28.2C35.9 28.2 39 30.1 39 33.4V34.3C39 35.0 38.4 35.6 37.7 35.6H25.3C24.6 35.6 24 35.0 24 34.3V33.4Z" fill="url(#portraitGrad)" />

  <!-- Centered Skeleton Lines (center: 31.5) -->
  <rect x="22.5" y="39.2" width="18" height="2.6" rx="1.3" fill="#c026d3" fill-opacity="0.85" />
  <rect x="22.5" y="43.8" width="12" height="2.6" rx="1.3" fill="#c026d3" fill-opacity="0.42" />

  <!-- Top-Right 4-Point AI Sparkles -->
  <path d="M47.5 7.5C48.0 12.3 50.0 14.3 54.8 14.8C50.0 15.3 48.0 17.3 47.5 22.1C47.0 17.3 45.0 15.3 40.2 14.8C45.0 14.3 47.0 12.3 47.5 7.5Z" fill="url(#sparkleGrad)" />
  <path d="M54.2 20.8C54.4 22.5 55.1 23.2 56.8 23.4C55.1 23.6 54.4 24.3 54.2 26.0C54.0 24.3 53.3 23.6 51.6 23.4C53.3 23.2 54.0 22.5 54.2 20.8Z" fill="white" fill-opacity="0.92" />
</svg>
